[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phys8"
version = "0.1.0"
description = "Интерактивное пособие по физике для 8 класса"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools]
packages = ["phys"]
